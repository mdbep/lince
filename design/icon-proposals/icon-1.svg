<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Lince — Night Sight</title>
  <desc>An amber feline eye sits between two ivory viewfinder corners on dark graphite.</desc>
  <defs>
    <linearGradient id="graphite" x1="260" y1="100" x2="721" y2="925" gradientUnits="userSpaceOnUse">
