      <stop offset="1" stop-color="#182128"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58676E"/>
      <stop offset="1" stop-color="#33414A"/>
    </linearGradient>
    <linearGradient id="amber" x1="427" y1="373" x2="568" y2="651" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC171"/>
      <stop offset=".64" stop-color="#F57D21"/>
      <stop offset="1" stop-color="#ED711D"/>
